name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Use HTTPS for public GitHub dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install dependencies
        run: npm ci

      - name: Run verification
        id: verify
        run: |
          set +e
          npm run verify
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report verification result
        run: |
          echo "npm run verify exited with ${{ steps.verify.outputs.exit_code }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Known Phase 0 failures are tolerated until docs/restructure/VERIFICATION.md is fully populated." >> "$GITHUB_STEP_SUMMARY"

      - name: Build artifact contents
        if: github.ref == 'refs/heads/main'
        run: npm run build

      - name: Upload dist artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
